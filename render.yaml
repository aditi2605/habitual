services:
  - type: web
    name: habitual-api
    runtime: python
    rootDir: backend
    buildCommand:  pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: DATABASE_URL
        fromDatabase:
          name: habitual-db
          property: connectionString

databases:
  - name: habitual-db
    databaseName: habitual
    user: habitual